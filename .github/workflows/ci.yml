# CI für Skriptorium (Klasse M, docs/project-context.md Abschnitt 7).
# Zweite, unabhängige Diagnoseschicht zusätzlich zu den lokalen Hooks - ersetzt sie nicht.
# Alle Jobs sind Pflicht-Gates (Merge-Block bei Rot). Versionen: docs/project-context.md
# Abschnitt 3 und 7, Action-Versionen nach Regel-001 (ADR-015).

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14.7"
  UV_VERSION: "0.12.19"
  NODE_VERSION: "24.21.0"

jobs:
  pre-commit:
    name: Pre-Commit (alle Hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync --frozen --python "${PYTHON_VERSION}"
      - run: npm ci
      - run: uv run --frozen pre-commit run --all-files --show-diff-on-failure

  python:
    name: Python – Lint, Format, Typen, Sicherheit, Audit, Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync --frozen --python "${PYTHON_VERSION}"
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Format-Check
        run: uv run --frozen ruff format --check .
      - name: Type-Check
        run: uv run --frozen mypy --strict src/ tests/
      - name: Security-Scan
        run: uv run --frozen bandit -r src/ -c pyproject.toml
      - name: Dependency-Audit
        run: uv run --frozen pip-audit --skip-editable
      - name: Tests mit Coverage (global 80 %, Zeilen und Zweige zusammen gemessen)
        run: uv run --frozen pytest --cov --cov-report=term
      - name: Coverage kritischer Pfade (canon, context – 90 % Lines)
        run: |
          for module in canon context; do
            if [ -d "src/skriptorium/${module}" ]; then
              uv run --frozen coverage report --include="src/skriptorium/${module}/*" --fail-under=90
            else
              echo "src/skriptorium/${module} existiert noch nicht – Prüfung greift ab seinem Anlegen"
            fi
          done

  typescript:
    name: TypeScript – Lint, Format, Typen, Audit, Tests, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint . --max-warnings 0 --report-unused-disable-directives
      - name: Format-Check
        run: npx prettier --check .
      - name: Type-Check
        run: npx tsc --noEmit
      - name: Dependency-Audit
        run: npm audit --audit-level=high
      - name: Tests mit Coverage (80 % Lines, 70 % Branches)
        run: npx vitest run --coverage
      - name: Build
        run: npx vite build

  e2e:
    name: End-to-End – Server und Oberfläche in Chromium (ADR-019)
    runs-on: ubuntu-latest
    # A stuck Chromium download held the job for over 4 hours (2026-10-08); normal runs take
    # 1-2 minutes, the slowest seen about 10 (ADR-045).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync --frozen --python "${PYTHON_VERSION}"
      - run: npm ci
      - name: Chromium für Playwright installieren
        run: npx playwright install --with-deps chromium
      - name: Oberfläche bauen
        run: npx vite build
      - name: End-to-End-Tests
        run: npx playwright test
