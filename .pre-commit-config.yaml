# Pre-Commit-Konfiguration für Skriptorium (docs/project-context.md Abschnitt 7).
#
# Derzeit aktiv: markdownlint-cli2 (Version gepinnt, verifiziert 2026-08-13).
# TODO(fahrplan-ref: 2.1): Hooks für Python (ruff, ruff-format, mypy, bandit) und
#   TypeScript (eslint, prettier, tsc, vitest related) aus templates/pre-commit/ ergänzen,
#   sobald pyproject.toml und package.json existieren; Versionen nach Regel-001 pinnen.
repos:
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
