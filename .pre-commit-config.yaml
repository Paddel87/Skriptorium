# Pre-Commit-Konfiguration für Dev-Templates selbst (S-4, docs/fahrplan.md).
#
# Einziger Hook: markdownlint-cli2. Läuft über die Node-Sprachumgebung, die pre-commit
# selbst isoliert verwaltet - keine manuelle Node-Installation nötig, nur `pre-commit`
# (Python) selbst. Version gepinnt und gegen die npm-Registry sowie den offiziellen
# .pre-commit-hooks.yaml des Projekts verifiziert (2026-08-13).
repos:
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
