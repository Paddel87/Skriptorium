[project]
name = "skriptorium"
version = "0.0.0"
description = "Schreibwerkstatt mit Welten als verbindlichem Kanon"
license = "AGPL-3.0-only"
requires-python = "==3.14.*"
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "pydantic>=2.13.5,<3",
    "pyyaml>=6.0.3,<7",
    "uvicorn>=0.52.4,<0.53",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4,<2",
    "httpx>=0.28.1,<0.29",
    "mypy>=1.20.2,<1.21",
    "pip-audit>=2.10.1,<3",
    "pre-commit>=4.6.2,<5",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.16.9,<0.17",
    "shellcheck-py>=0.11.0.1,<0.12",
    "types-pyyaml>=6.0.12.20260906,<7",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["spikes", "templates"]
force-exclude = true

[tool.ruff.format]
# Documentation is hand-maintained and not auto-formatted (same rule as .prettierignore).
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "spikes", "templates"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
filterwarnings = [
    "error",
    # Named exception from the warning inventory (docs/project-context.md section 7, ADR-015);
    # removed when switching to httpx2 in roadmap step D.5.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["skriptorium"]

[tool.coverage.report]
fail_under = 80
show_missing = true
